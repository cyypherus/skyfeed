[package]
name = "sqlite-feed"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
log = "0.4.25"
skyfeed = { git = "https://github.com/cyypherus/skyfeed.git", rev = "05888698112e8b2f6a2c85e11f5fdd196f12a2ab" }
# skyfeed = { path = "../.." }
tokio = { version = "1.43.0", features = ["full", "time"] }
rusqlite = { version = "0.33.0", features = ["bundled"] }
chrono = "0.4.39"
regex = "1.11.1"
whatlang = "0.16.4"
metrics = "0.24.1"
metrics-exporter-prometheus = "0.16.2"

[profile.release]
lto = true
